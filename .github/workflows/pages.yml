name: Build IE Casino Games for GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild approved casino and extract embedded assets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, re, hashlib, mimetypes, json, shutil

          parts = sorted(Path('build23').glob('payload-*.b64'))
          if len(parts) != 39:
              raise SystemExit(f'Expected 39 Build 23 payload files, found {len(parts)}')

          raw_b64 = ''.join(p.read_text().strip() for p in parts)
          html = base64.b64decode(raw_b64).decode('utf-8')

          # Preserve approved Build 23; only restore faster interaction timing.
          replacements = [
              ('}, 420);\n  }\n\n  function showEntrance', '}, 180);\n  }\n\n  function showEntrance'),
              ("},1900);\n    setTimeout(()=>{\n      warp.classList.add('b23-flash');", "},900);\n    setTimeout(()=>{\n      warp.classList.add('b23-flash');"),
              ("},3150);\n    setTimeout(()=>{\n      openSlot();", "},1750);\n    setTimeout(()=>{\n      openSlot();"),
              ("},3480);", "},2100);"),
              ("if(n>=14)", "if(n>=11)"),
              ("},420)}},82)", "},260)}},68)"),
              ("setTimeout(spin,120)", "setTimeout(spin,45)"),
              ("setTimeout(spin,R.p?1300:760)", "setTimeout(spin,R.p?760:480)"),
          ]
          for old,new in replacements:
              html = html.replace(old,new)

          # Time Travel update: Pharaohs uses the established site time-warp overlay.
          pharaoh_transition = r'''<script id="pharaoh-transition-sync">
          (()=>{
            window.b23WarpToSlot=function(openSlot){
              const warp=document.getElementById('timeWarp');
              const title=document.getElementById('warpTitle');
              const subtitle=document.getElementById('warpSubtitle');
              if(!warp){openSlot();return;}
              if(title)title.textContent='PHARAOHS OF THE NILE';
              if(subtitle)subtitle.textContent='OPENING TEMPORAL GATE';
              warp.classList.remove('hidden','breaking');
              setTimeout(()=>warp.classList.add('breaking'),900);
              setTimeout(()=>{if(subtitle)subtitle.textContent='ERA LOCKED'},1450);
              setTimeout(()=>{
                warp.classList.add('hidden');
                warp.classList.remove('breaking');
                openSlot();
              },2050);
            };
          })();
          </script>'''
          html = html.replace('</body>', pharaoh_transition + '\n</body>', 1)

          # Reel finish: stagger each column visually and delay the result until the last column settles.
          old_finish = "clearInterval(tm);r.classList.remove(&#x27;spinning&#x27;);S.matrix=matrix();const R=evaluate();render(R.w);setTimeout(()=&gt;{"
          new_finish = "clearInterval(tm);r.classList.remove(&#x27;spinning&#x27;);r.classList.add(&#x27;stopping&#x27;);S.matrix=matrix();const R=evaluate();render(R.w);[120,390,720,1120,1580].forEach((ms,i)=&gt;setTimeout(()=&gt;tone(340+i*105,i===4?.13:.075,&#x27;triangle&#x27;,i===4?.13:.09),ms));setTimeout(()=&gt;r.classList.remove(&#x27;stopping&#x27;),1900);setTimeout(()=&gt;{"
          html = html.replace(old_finish,new_finish,1)
          html = html.replace("},420)}},82)","},2050)}},82)",1)

          # Column-by-column settle animation, with the fifth column held longest.
          reel_css = r'''<style id="pharaoh-reel-stops">
          #reels.stopping .cell{will-change:transform,filter,opacity}
          #reels.stopping .cell:nth-child(5n+1){animation:phSettle .34s cubic-bezier(.2,.85,.25,1) 0s both}
          #reels.stopping .cell:nth-child(5n+2){animation:phSettle .38s cubic-bezier(.2,.85,.25,1) .26s both}
          #reels.stopping .cell:nth-child(5n+3){animation:phSettle .42s cubic-bezier(.2,.85,.25,1) .58s both}
          #reels.stopping .cell:nth-child(5n+4){animation:phSettle .48s cubic-bezier(.2,.85,.25,1) .94s both}
          #reels.stopping .cell:nth-child(5n+5){animation:phSettle .58s cubic-bezier(.2,.85,.25,1) 1.34s both}
          @keyframes phSettle{
            0%{transform:translateY(-36%) scale(.97);filter:blur(7px);opacity:.55}
            58%{transform:translateY(7%) scale(1.015);filter:blur(1.5px);opacity:1}
            100%{transform:translateY(0) scale(1);filter:blur(0);opacity:1}
          }
          </style>'''
          # The slot game lives inside iframe srcdoc, so inject the CSS into that embedded document.
          html = html.replace('&lt;/head&gt;&lt;body&gt;', reel_css.replace('<','&lt;').replace('>','&gt;') + '&lt;/head&gt;&lt;body&gt;',1)

          html = html.replace('</head>', '''<style id="pages-response-patch">
          button,a,[role="button"]{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
          .enter-button,.door-enter,.navbtn,.action-btn,.chip,.portal-card{transition-duration:.12s!important}
          .time-warp,.b23-warp-rings,.b23-warp-beams,.b23-warp-core{will-change:transform,opacity}
          </style></head>''', 1)

          out = Path('_site')
          if out.exists(): shutil.rmtree(out)
          asset_dir = out / 'assets'
          asset_dir.mkdir(parents=True)

          pat = re.compile(r'data:([^;,]+);base64,([A-Za-z0-9+/=\s]+)')
          seen = {}
          extmap = {
              'image/png':'.png','image/webp':'.webp','image/jpeg':'.jpg',
              'audio/mpeg':'.mp3','audio/wav':'.wav','audio/ogg':'.ogg',
              'video/mp4':'.mp4','image/svg+xml':'.svg','font/woff2':'.woff2'
          }
          def repl(m):
              mime=m.group(1)
              payload=re.sub(r'\s+','',m.group(2))
              data=base64.b64decode(payload)
              h=hashlib.sha256(data).hexdigest()
              ext=extmap.get(mime,mimetypes.guess_extension(mime) or '.bin')
              name=f'{h[:16]}{ext}'
              if h not in seen:
                  (asset_dir/name).write_bytes(data)
                  seen[h]=name
              return f'assets/{name}'

          html = pat.sub(repl, html)
          (out/'index.html').write_text(html, encoding='utf-8')
          (out/'.nojekyll').write_text('')
          (out/'build-info.json').write_text(json.dumps({
              'build':'github-pages-26-transition-reels',
              'source':'approved Build 23',
              'assets':len(seen)
          }, indent=2))
          print(f'Prepared {len(seen)} assets for GitHub Pages')
          PY

      - name: Publish gh-pages branch
        shell: bash
        run: |
          git config user.name "IE Casino Games Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin gh-pages || true
          git switch --orphan gh-pages-temp
          git rm -rf . >/dev/null 2>&1 || true
          cp -R _site/. .
          rm -rf _site
          git add -A
          git commit -m "Publish approved IE Casino Games"
          git branch -M gh-pages
          git push --force origin gh-pages

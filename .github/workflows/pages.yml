name: Build IE Casino Games for GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild approved casino and extract embedded assets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, re, hashlib, mimetypes, json, shutil

          parts = sorted(Path('build23').glob('payload-*.b64'))
          if len(parts) != 39:
              raise SystemExit(f'Expected 39 Build 23 payload files, found {len(parts)}')

          raw_b64 = ''.join(p.read_text().strip() for p in parts)
          html = base64.b64decode(raw_b64).decode('utf-8')

          # Preserve approved Build 23; only restore faster interaction timing.
          replacements = [
              ('}, 420);\n  }\n\n  function showEntrance', '}, 180);\n  }\n\n  function showEntrance'),
              ("},1900);\n    setTimeout(()=>{\n      warp.classList.add('b23-flash');", "},900);\n    setTimeout(()=>{\n      warp.classList.add('b23-flash');"),
              ("},3150);\n    setTimeout(()=>{\n      openSlot();", "},1750);\n    setTimeout(()=>{\n      openSlot();"),
              ("},3480);", "},2100);"),
              ("if(n>=14)", "if(n>=11)"),
              ("},420)}},82)", "},260)}},68)"),
              ("setTimeout(spin,120)", "setTimeout(spin,45)"),
              ("setTimeout(spin,R.p?1300:760)", "setTimeout(spin,R.p?760:480)"),
          ]
          for old,new in replacements:
              html = html.replace(old,new)

          html = html.replace('</head>', '''<style id="pages-response-patch">
          button,a,[role="button"]{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
          .enter-button,.door-enter,.navbtn,.action-btn,.chip,.portal-card{transition-duration:.12s!important}
          .time-warp,.b23-warp-rings,.b23-warp-beams,.b23-warp-core{will-change:transform,opacity}
          </style></head>''', 1)

          out = Path('_site')
          if out.exists(): shutil.rmtree(out)
          asset_dir = out / 'assets'
          asset_dir.mkdir(parents=True)

          pat = re.compile(r'data:([^;,]+);base64,([A-Za-z0-9+/=\s]+)')
          seen = {}
          extmap = {
              'image/png':'.png','image/webp':'.webp','image/jpeg':'.jpg',
              'audio/mpeg':'.mp3','audio/wav':'.wav','audio/ogg':'.ogg',
              'video/mp4':'.mp4','image/svg+xml':'.svg','font/woff2':'.woff2'
          }
          def repl(m):
              mime=m.group(1)
              payload=re.sub(r'\s+','',m.group(2))
              data=base64.b64decode(payload)
              h=hashlib.sha256(data).hexdigest()
              ext=extmap.get(mime,mimetypes.guess_extension(mime) or '.bin')
              name=f'{h[:16]}{ext}'
              if h not in seen:
                  (asset_dir/name).write_bytes(data)
                  seen[h]=name
              return f'assets/{name}'

          html = pat.sub(repl, html)

          # Pharaohs: keep the known-good portal transition, but make the slot reels
          # stop one column at a time with a longer fifth-reel reveal.
          import html as html_lib
          new_spin = r'''function spin(){
            if(S.spinning)return;
            const tot=S.bet*S.rows,free=S.free>0;
            if(!free&&S.credits<tot){S.auto=0;sync();stat('NOT ENOUGH CREDITS','lose');loseSound();return}
            S.spinning=true;S.win=0;
            if(free)S.free--;else S.credits-=tot;
            sync();
            const r=document.getElementById('reels');
            r.classList.add('spinning');
            tone(110,.22,'sawtooth',.10);

            const finalM=matrix();
            const stopped=[false,false,false,false,false];
            let ticks=0;
            let timer=null;
            const started=performance.now();

            function roll(){
              if(!S.spinning)return;
              const fresh=matrix();
              for(let row=0;row<3;row++){
                for(let col=0;col<5;col++){
                  if(!stopped[col])S.matrix[row][col]=fresh[row][col];
                }
              }
              render();
              ticks++;
              const elapsed=performance.now()-started;
              if(ticks%2===0)tone(175+Math.min(320,ticks*8),.038,'square',.07);
              const gap=elapsed<700?62:elapsed<1250?86:elapsed<1750?118:155;
              timer=setTimeout(roll,gap);
            }

            function stopCol(col,last=false){
              stopped[col]=true;
              for(let row=0;row<3;row++)S.matrix[row][col]=finalM[row][col];
              render();
              tone(350+col*100,last?.14:.085,'triangle',last?.11:.085);

              if(last){
                clearTimeout(timer);
                S.matrix=finalM;
                render();
                r.classList.remove('spinning');
                setTimeout(()=>{
                  const R=evaluate();
                  render(R.w);
                  setTimeout(()=>{
                    S.win=R.p;S.credits+=R.p;S.spinning=false;sync();
                    if(R.p){stat('YOU WIN','win');winSound()}
                    else{stat('NO WIN','lose');loseSound()}
                    if(S.auto>0){
                      S.auto--;sync();
                      if(S.auto>0)setTimeout(spin,R.p?900:650)
                    }
                  },360);
                },160);
              }
            }

            roll();
            setTimeout(()=>stopCol(0),620);
            setTimeout(()=>stopCol(1),900);
            setTimeout(()=>stopCol(2),1210);
            setTimeout(()=>stopCol(3),1580);
            setTimeout(()=>stopCol(4,true),2220+Math.floor(Math.random()*220));
          }'''
          encoded_spin = html_lib.escape(new_spin, quote=True)
          slot_pattern = r'function spin\(\)\{.*?\}\nfunction press\(el\)'
          html, spin_hits = re.subn(slot_pattern, encoded_spin + '\nfunction press(el)', html, count=1, flags=re.S)
          if spin_hits != 1:
              raise SystemExit(f'Pharaoh spin patch failed: expected 1 match, got {spin_hits}')

          (out/'index.html').write_text(html, encoding='utf-8')
          (out/'.nojekyll').write_text('')
          (out/'build-info.json').write_text(json.dumps({
              'build':'github-pages-26-staggered-reels',
              'source':'approved Build 23',
              'assets':len(seen)
          }, indent=2))
          print(f'Prepared {len(seen)} assets for GitHub Pages')
          PY

      - name: Publish gh-pages branch
        shell: bash
        run: |
          git config user.name "IE Casino Games Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin gh-pages || true
          git switch --orphan gh-pages-temp
          git rm -rf . >/dev/null 2>&1 || true
          cp -R _site/. .
          rm -rf _site
          git add -A
          git commit -m "Publish approved IE Casino Games"
          git branch -M gh-pages
          git push --force origin gh-pages

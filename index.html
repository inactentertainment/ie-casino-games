<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IE Casino Games — Restored Build 23</title>
<style>
html,body{margin:0;min-height:100%;background:#020304;color:#fff;font-family:Arial,sans-serif}
#loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}
.mark{font-size:clamp(28px,6vw,42px);font-weight:900;letter-spacing:.08em}
.sub{margin-top:12px;color:#cbd3d8;font-size:14px;letter-spacing:.12em}
.bar{width:min(420px,78vw);height:5px;margin:24px auto 0;background:#1b2126;border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#858f97,#fff,#959fa7);transition:width .12s ease}
.note{margin-top:12px;color:#8f9aa2;font-size:11px;letter-spacing:.05em}
</style>
</head>
<body>
<div id="loading"><div><div class="mark">IE · CASINO GAMES</div><div class="sub">RESTORING APPROVED BUILD 23</div><div class="bar"><i id="bar"></i></div><div class="note">Loading the exact approved game build</div></div></div>
<script>
(async()=>{
  try{
    const files=Array.from({length:39},(_,i)=>`build23/payload-${String(i+1).padStart(3,'0')}.b64`);
    let done=0;
    const bar=document.getElementById('bar');
    const fetchPart=async f=>{
      const r=await fetch(f,{cache:'force-cache'});
      if(!r.ok) throw new Error('Missing deployment payload '+f);
      const t=await r.text();
      done++;
      bar.style.width=Math.round((done/files.length)*100)+'%';
      return t;
    };
    const parts=await Promise.all(files.map(fetchPart));
    const b64=parts.join('').replace(/\s+/g,'');
    const bin=atob(b64);
    const bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    const html=new TextDecoder('utf-8').decode(bytes);
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    document.getElementById('loading').innerHTML='<div><div class="mark">IE · CASINO GAMES</div><p>Approved Build 23 could not finish loading.</p><p style="color:#aaa">'+String(err.message||err)+'</p></div>';
  }
})();
</script>
</body>
</html>
